# 把介紹站部署到 GitHub Pages。
#
# **這裡不再部署簽名頁。** 先前它跟站一起放上來，理由是它自包含、交易在 `#`
# 後面所以不需要後端——那些理由都還成立，但「可以放」不等於「該放兩份」。
#
# 簽名頁只留 Cloudflare worker 的 `/sign` 一個位置，因為那是面板真的會交接過去
# 的地方：MCP server 用 `PUBLIC_URL` 算出 signPageUrl 送給面板，worker 的
# `PUBLIC_URL` 指的就是它自己。Pages 這份沒有任何東西會指過來。
#
# 為什麼要收掉而不是留著當備援：那一頁只讀網址 fragment，誰都做得出一個指向它
# 的連結。它現在會自己解 calldata、不掛「主網模擬」徽章、解出授權時不自動叫錢包
# （見 app/src/sign/calldata.ts），但每多一個託管位置就多一個要一起維護這些性質
# 的地方，而 worker 是內嵌 build 產物、Pages 是 workflow 複製檔案，兩條更新路徑
# 不同步的時候不會有人發現。2026-08-09 就發生過：main 上的加固進了 Pages，
# worker 還在送舊版。

name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不取消進行中的——取消到一半會留下半套的線上版本
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # ── 站 ─────────────────────────────────────────────────
      - name: 安裝 site
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: 建站（子路徑託管）
        working-directory: site
        env:
          # repo 叫 Vigil，Pages 網址就是 /Vigil/。不設這個所有資源會 404。
          PAGES_BASE_PATH: /Vigil
        run: pnpm build

      # 舊部署留下來的 site/out/sign 不會自己消失——Pages 每次換掉整份
      # artifact，所以這一支跑完之後 /Vigil/sign/ 就 404 了，不需要額外清理。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
